name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout NXLauncher
        uses: actions/checkout@v4
        with:
          ref: nxlauncher-v1.0.0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Prepare NXLauncher signing key
        shell: bash
        env:
          NX_KEYSTORE_B64: ${{ secrets.NX_KEYSTORE_B64 }}
          NX_KEYSTORE_PASSWORD: ${{ secrets.NX_KEYSTORE_PASSWORD }}
          NX_KEY_ALIAS: ${{ secrets.NX_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$NX_KEYSTORE_B64"
          test -n "$NX_KEYSTORE_PASSWORD"
          test -n "$NX_KEY_ALIAS"
          printf '%s' "$NX_KEYSTORE_B64" | base64 --decode > app_pojavlauncher/NXLauncher-release.jks
          test -s app_pojavlauncher/NXLauncher-release.jks
          echo "NX_KEYSTORE_PATH=$GITHUB_WORKSPACE/app_pojavlauncher/NXLauncher-release.jks" >> "$GITHUB_ENV"
          echo "NX_KEYSTORE_PASSWORD=$NX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NX_KEY_ALIAS=$NX_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh || true
          mkdir -p out

      - name: Build Release APK
        run: |
          ./gradlew :app_pojavlauncher:assembleRelease --no-build-cache --stacktrace
          apk=$(find app_pojavlauncher/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" out/NXLauncher-v1.0.0.apk
          md5sum out/NXLauncher-v1.0.0.apk > out/NXLauncher-v1.0.0.md5
          sha256sum out/NXLauncher-v1.0.0.apk > out/NXLauncher-v1.0.0.sha256

      - name: Build Debug APK
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --no-build-cache --stacktrace
          apk=$(find app_pojavlauncher/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" out/NXLauncher-v1.0.0-debug.apk
          md5sum out/NXLauncher-v1.0.0-debug.apk > out/NXLauncher-v1.0.0-debug.md5

      - name: Upload NXLauncher APKs
        uses: actions/upload-artifact@v4
        with:
          name: NXLauncher-v1.0.0
          path: out/*
