name: NXLauncher Android CI
on:
  workflow_dispatch:
  push:
    branches: [nxlauncher-v1.0.0, main, master]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          gradle-version: '9.5.0'
      - name: Fix Android resources safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('app_pojavlauncher/src/main/res')]
          # Only repair actual Android string-format syntax. Do not touch dependency caches.
          for root in roots:
              for p in root.glob('values*/strings.xml'):
                  s = p.read_text(encoding='utf-8')
                  # Android aapt requires positional arguments when a format string has >1 argument.
                  def fix_string(m):
                      attrs, body = m.group(1), m.group(2)
                      if 'formatted="false"' in attrs:
                          return m.group(0)
                      toks = list(re.finditer(r'%(?!%)(?:[0-9]+\$)?[-+0-9.#]*[a-zA-Z]', body))
                      if len(toks) <= 1 or any(re.search(r'%[0-9]+\$', t.group(0)) for t in toks):
                          return m.group(0)
                      i = 0
                      def repl(t):
                          nonlocal i
                          i += 1
                          x = t.group(0)
                          return '%' + str(i) + '$' + x[1:]
                      body = re.sub(r'%(?!%)[-+0-9.#]*[a-zA-Z]', repl, body)
                      return '<string' + attrs + '>' + body + '</string>'
                  s = re.sub(r'<string\b([^>]*)>(.*?)</string>', fix_string, s, flags=re.S)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app_pojavlauncher:assembleRelease --stacktrace
          mkdir -p out
          apk=$(find app_pojavlauncher/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" out/NXLauncher-v1.0.0.apk
          sha256sum out/NXLauncher-v1.0.0.apk > out/NXLauncher-v1.0.0.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NXLauncher-v1.0.0
          path: out/*
