name: NXLauncher Android CI

on:
  pull_request:
  push:
    branches:
      - nxlauncher-v1.0.0
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          gradle-version: '9.5.0'

      - name: Prepare
        run: |
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Normalize Android string resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('app_pojavlauncher/src/main/res')
          for p in root.glob('values*/strings.xml'):
              s = p.read_text(encoding='utf-8')
              # Android resource strings do not accept arbitrary backslash escapes.
              s = re.sub(r'(?<!\\)\\(?![nrt"\\\'])', r'\\\\', s)
              # Convert printf-style placeholders to positional placeholders where possible.
              counter = {}
              def repl(m):
                  token = m.group(0)
                  if token.startswith('%%'):
                      return token
                  key = (p, token)
                  counter[token] = counter.get(token, 0) + 1
                  return '%' + str(counter[token]) + token[1:]
              # Only normalize strings that contain more than one format argument.
              def string_repl(m):
                  body = m.group(2)
                  args = re.findall(r'%(?!%)[0-9]*\$?[0-9]*(?:\.[0-9]+)?[a-zA-Z]', body)
                  if len(args) > 1 and not any('$' in a for a in args):
                      i = 0
                      def a(m2):
                          nonlocal i
                          i += 1
                          return '%' + str(i) + m2.group(0)[1:]
                      body = re.sub(r'%(?!%)[0-9]*\$?[0-9]*(?:\.[0-9]+)?[a-zA-Z]', a, body)
                  return m.group(1) + body + m.group(3)
              s = re.sub(r'(<string\\b[^>]*>)(.*?)(</string>)', string_repl, s, flags=re.S)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Build NXLauncher v1.0.0 release APK
        run: |
          gradle :app_pojavlauncher:assembleRelease
          cp app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/NXLauncher-v1.0.0.apk
          sha256sum out/NXLauncher-v1.0.0.apk > out/NXLauncher-v1.0.0.sha256

      - name: Build debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/NXLauncher-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NXLauncher-v1.0.0
          path: out/NXLauncher-v1.0.0.*

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NXLauncher-debug
          path: out/NXLauncher-debug.apk
