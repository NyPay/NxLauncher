name: NXLauncher Android CI

on:
  pull_request:
  push:
    branches:
      - nxlauncher-v1.0.0
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          gradle-version: '9.5.0'

      - name: Prepare
        run: |
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Validate Android string resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          root = Path('app_pojavlauncher/src/main/res')
          for p in root.glob('values*/strings.xml'):
              ET.parse(p)
              text = p.read_text(encoding='utf-8')
              bad = re.findall(r'(?<!\\)\\(?![nrt"\\\'])', text)
              if bad:
                  raise SystemExit(f'Invalid backslash escape in {p}')
              for m in re.finditer(r'<string\b([^>]*)>(.*?)</string>', text, re.S):
                  body = m.group(2)
                  args = re.findall(r'%(?!%)(?:[0-9]+\$)?[-+0-9.#]*[a-zA-Z]', body)
                  if len(args) > 1 and not any(re.match(r'%[0-9]+\$', a) for a in args):
                      raise SystemExit(f'Non-positional format arguments in {p}: {body[:120]}')
          PY

      - name: Build NXLauncher v1.0.0 release APK
        run: |
          gradle :app_pojavlauncher:assembleRelease --stacktrace
          cp app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/NXLauncher-v1.0.0.apk
          sha256sum out/NXLauncher-v1.0.0.apk > out/NXLauncher-v1.0.0.sha256

      - name: Build debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --stacktrace
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/NXLauncher-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NXLauncher-v1.0.0
          path: out/NXLauncher-v1.0.0.*

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NXLauncher-debug
          path: out/NXLauncher-debug.apk
