name: NXLauncher Android CI
on:
  workflow_dispatch:
  push:
    branches: [nxlauncher-v1.0.0, main, master]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          gradle-version: '9.5.0'
      - name: Fix Android resource format strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('app_pojavlauncher/src/main/res').glob('values*/strings.xml'):
              s = p.read_text(encoding='utf-8')
              # Android requires positional arguments when a string has multiple format arguments.
              n = 0
              def fix(m):
                  nonlocal_dummy = None
                  nonlocal_counter[0] += 1
                  return '%' + str(nonlocal_counter[0]) + '$' + m.group(1)
              # Convert only unnumbered printf arguments, preserving %% and already-numbered args.
              parts = re.split(r'(%(?:[0-9]+\$)?[-+0-9.#]*[a-zA-Z]|%%)', s)
              out=[]; count=0
              for token in parts:
                  if re.fullmatch(r'%[a-zA-Z]', token) and token != '%%':
                      count += 1
                      out.append('%'+str(count)+'$'+token[1:])
                  else:
                      out.append(token)
              s=''.join(out)
              # Remove invalid literal backslash escapes which AAPT rejects; preserve XML escapes.
              s=re.sub(r'\\(?![nrt"\\\'])', '', s)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app_pojavlauncher:assembleRelease --stacktrace
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/release/*.apk out/NXLauncher-v1.0.0.apk
          sha256sum out/NXLauncher-v1.0.0.apk > out/NXLauncher-v1.0.0.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NXLauncher-v1.0.0
          path: out/*
