plugins {
    id 'com.android.application' version '9.3.1'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    String ciVersion = System.getenv("NX_VERSION_NAME")
    if (ciVersion != null && !ciVersion.trim().isEmpty()) {
        return ciVersion.trim()
    }

    String TAG = ""
    String semVer = "1.0.0"
    String TAG_PART_COMMIT = ""
    String TAG_STRING
    try { TAG = providers.exec { commandLine 'git', 'describe', '--tags'; ignoreExitValue = true }.getStandardOutput().asText.get() } catch (Exception ignored) {}
    if (TAG.toString().trim().isEmpty()) {
        try { TAG_PART_COMMIT = providers.exec { commandLine 'git', 'describe', '--always', '--tags'; ignoreExitValue = true }.getStandardOutput().asText.get() } catch (Exception ignored) {}
    }
    if(!TAG.isBlank()) TAG_STRING = TAG
    else TAG_STRING = TAG_PART_COMMIT.isBlank() ? ("NXLauncher-LOCAL-" + getDate()) : ('nxlauncher-' + getDate() + '-' + TAG_PART_COMMIT.toString().trim())
    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    return TAG_STRING.trim().replace("-g", "-") + "-" + (isRelease ? "release-" : "debug-") + semVer
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY")
    if(key != null) return key
    File f = new File("$projectDir/curseforge_key.txt")
    if(f.canRead() && f.isFile()) return f.text
    return "DUMMY"
}

configurations { instrumentedClasspath { canBeConsumed = false; canBeResolved = true } }

android {
    namespace 'net.kdt.pojavlaunch'
    compileSdk = 37
    defaultConfig {
        applicationId "org.nypay.nxlauncher"
        minSdkVersion 21
        targetSdkVersion 34
        def ciVersionCode = System.getenv("NX_VERSION_CODE")
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 10000
        versionName getVersionName()
        multiDexEnabled true
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild { ndkBuild { arguments "APP_SHORT_COMMANDS=true" } }
    }
    signingConfigs {
        customDebug { storeFile file("debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" }
        customRelease {
            def nxKeyStorePath = System.getenv("NX_KEYSTORE_PATH")
            storeFile nxKeyStorePath ? file(nxKeyStorePath) : file("NXLauncher-release.jks")
            storePassword System.getenv("NX_KEYSTORE_PASSWORD")
            keyAlias System.getenv("NX_KEY_ALIAS") ?: "nxlauncher_release"
            keyPassword System.getenv("NX_KEYSTORE_PASSWORD")
        }
        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'; minifyEnabled false; shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "NXLauncher (Debug)"; resValue "string", "app_short_name", "NXLauncher (Debug)"
            resValue 'string', 'application_package', 'org.nypay.nxlauncher.debug'
            resValue 'string', 'storageProviderAuthorities', 'org.nypay.nxlauncher.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'org.nypay.nxlauncher.scoped.controlfolder.debug'
        }
        proguard { initWith debug; minifyEnabled true; shrinkResources true }
        proguardNoDebug { initWith proguard; debuggable false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customRelease
            resValue "string", "app_name", "NXLauncher"; resValue "string", "app_short_name", "NXLauncher"
            resValue 'string', 'storageProviderAuthorities', 'org.nypay.nxlauncher.scoped.gamefolder'
            resValue 'string', 'application_package', 'org.nypay.nxlauncher'
        }
        gplay { initWith release; signingConfig signingConfigs.googlePlayBuild; matchingFallbacks = [ 'release' ] }
    }
    ndkVersion = "27.3.13750724"
    externalNativeBuild { ndkBuild { path file('src/main/jni/Android.mk') } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    bundle { language { enableSplit = false } }
    packagingOptions { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libcutils.so']; pickFirsts += ['**/libbytehook.so'] } }
    buildFeatures { prefab true; buildConfig true }
    lint { abortOnError false }
}

afterEvaluate {
    def componentJars = [":forge_installer:jar", ":arc_dns_injector:jar", ":MioLibPatcher:jar", ":jre_lwjgl3glfw:jar"]
    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { t -> t.dependsOn(componentJars) }
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach { t -> t.dependsOn(componentJars) }
}

dependencies {
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'
    implementation 'org.tukaani:xz:1.8'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'
    implementation 'com.bytedance:bytehook:1.0.10'
    implementation 'top.fifthlight.touchcontroller:proxy-client-android:0.0.4'
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation "net.java.dev.jna:jna:5.14.0@aar"
}
apply from: rootProject.file('gradle/prefab_bypass.gradle')
